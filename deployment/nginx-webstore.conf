# Rybella Web Store - Nginx: Static Files + API Proxy
proxy_cache_path /var/cache/nginx/rybella levels=1:2 keys_zone=rybella_catalog:20m max_size=200m inactive=15m use_temp_path=off;

map $arg_lite $catalog_products_skip_cache {
    default 1;
    "1" 0;
    "true" 0;
}

map $http_authorization $catalog_auth_bypass {
    default 0;
    "~." 1;
}

upstream rybella_backend {
    server backend:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location ^~ /api/backups {
        client_max_body_size 100M;
        proxy_pass http://rybella_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /api/img {
        proxy_pass http://rybella_backend/api/img;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/api/(categories|banners|brands|web-settings|offers|stories)/?$ {
        proxy_cache rybella_catalog;
        proxy_cache_valid 200 90s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $catalog_auth_bypass;
        proxy_no_cache $catalog_auth_bypass;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://rybella_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/products {
        proxy_cache rybella_catalog;
        proxy_cache_valid 200 90s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $catalog_auth_bypass $catalog_products_skip_cache;
        proxy_no_cache $catalog_auth_bypass $catalog_products_skip_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://rybella_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://rybella_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/.cache/ {
        proxy_pass http://rybella_backend/uploads/.cache/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering on;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /uploads/ {
        proxy_pass http://rybella_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
