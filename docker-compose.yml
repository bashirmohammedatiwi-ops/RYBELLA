# Rybella Iraq - Production Docker Compose
# شغّل دائماً من جذر المشروع:
#   ./deploy.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: rybella-postgres
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_connections=100
      - -c
      - work_mem=8MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rybella}
      POSTGRES_USER: ${POSTGRES_USER:-rybella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in deployment/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rybella-network
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rybella} -d ${POSTGRES_DB:-rybella}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    container_name: rybella-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rybella}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rybella}
      - PG_POOL_MAX=${PG_POOL_MAX:-50}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - SQLITE_PATH=/app/data/rybella.db
      - BACKUP_PATH=/app/backups
      - UPLOAD_PATH=/app/uploads
      - JWT_SECRET=${JWT_SECRET:-RybellaChangeThisSecretInEnv}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - API_URL=${API_URL:-http://localhost:4000}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - EXTERNAL_INVENTORY_API_URL=${EXTERNAL_INVENTORY_API_URL:-}
      - EXTERNAL_INVENTORY_API_EMAIL=${EXTERNAL_INVENTORY_API_EMAIL:-}
      - EXTERNAL_INVENTORY_API_PASSWORD=${EXTERNAL_INVENTORY_API_PASSWORD:-}
      - EXTERNAL_INVENTORY_API_TOKEN=${EXTERNAL_INVENTORY_API_TOKEN:-}
      - INVENTORY_SYNC_INTERVAL_MIN=${INVENTORY_SYNC_INTERVAL_MIN:-30}
      - INVENTORY_AUTO_SYNC=${INVENTORY_AUTO_SYNC:-1}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    networks:
      - rybella-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: deployment/admin.Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: rybella-web
    restart: always
    ports:
      - "127.0.0.1:${HTTP_PORT:-4000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rybella-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  webstore:
    build:
      context: .
      dockerfile: deployment/storefront-premium.Dockerfile
      args:
        - VITE_API_URL=
    container_name: rybella-webstore
    restart: always
    ports:
      - "127.0.0.1:${WEBSTORE_PORT:-4003}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rybella-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    name: rybella_postgres_data
  backend_data:
    name: rybella_backend_data
  backend_uploads:
    name: rybella_backend_uploads
  backend_backups:
    name: rybella_backend_backups

networks:
  rybella-network:
    driver: bridge
